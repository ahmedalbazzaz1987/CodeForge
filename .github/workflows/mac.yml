name: Mac

# Builds Kryndev and runs CodeForgeKit's tests on every push (releases are still built on a Mac with scripts/release.sh).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
